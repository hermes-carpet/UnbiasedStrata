# Auto-build UnbiasedStrata (robertkarl/UnbiasedStrata) ahead-of-time for each machine
# profiled in .github/targets/*.env, and publish the binaries as a GitHub Release.
#
# Same pattern as hermes-carpet/whisper-cuda-win and llama-slim:
#   - a daily poll of upstream main; it only builds when upstream moved past the last
#     PUBLISHED commit (.github/upstream-sha), or on a manual/forced dispatch;
#   - a build that fails publishes nothing -- the last good release stays;
#   - on success, this fork's main is synced to the built upstream commit and the new
#     .github/upstream-sha is committed as hermes-carpet (that self-commit is also the
#     keepalive: GitHub disables cron workflows after 60 days without repo activity;
#     a quiet upstream gets an explicit keepalive commit after 45 days);
#   - any failure opens (or comments on) one issue labelled `auto-build`, like the
#     presenton fork's upstream-sync; the next green run closes it.
#
# Two halves per target, split by how often they change: setup-toolchain.sh (distro, CUDA,
# gcc, CPU wrapper -- only the profile changes it) and the compile of upstream's commit,
# with ccache carried across runs and keyed on a hash of the toolchain inputs. Measured
# first run: toolchain ~2 min, compile ~20 min, make test ~4.5 min -- so the cache that
# matters is ccache (a prebuilt toolchain image would save ~1.5 min and cost a 3 GB pull).
#
# A target = one .github/targets/<name>.env file (written on the target box by
# .github/scripts/scrape-target.sh). Each is built in a container of the target's distro
# with the target's exact CUDA toolkit, its GPU arch as SASS only (no PTX: nothing is
# JIT-compiled at run time), and ggml-cpu's -march=native swapped for the flags gcc
# resolves for -march=native on the target CPU. See .github/ci/build-in-container.sh.
#
# No GPU on the runners: CI runs upstream's `make test` (front end vs a fake engine) and
# checks the CUDA binaries structurally (SASS arch, no stray PTX, linked libs, glibc).

name: autobuild

on:
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:
    inputs:
      upstream_sha:
        description: 'Upstream commit to build (default: latest main)'
        required: false
        default: ''
      target:
        description: 'Only this target (.github/targets/<name>.env); default: all'
        required: false
        default: ''
      force:
        description: 'Build even if this upstream commit is already published'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write
  issues: write

concurrency:
  group: autobuild
  cancel-in-progress: false

env:
  UPSTREAM_REPO: robertkarl/UnbiasedStrata
  UPSTREAM_BRANCH: main
  ISSUE_LABEL: auto-build

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      build_sha: ${{ steps.check.outputs.build_sha }}
      label: ${{ steps.check.outputs.label }}
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve upstream commit and compare with last published
        id: check
        env:
 (not the start of the key)GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
 (not the start of the key)INPUT_SHA: ${{ inputs.upstream_sha }}
 (not the start of the key)FORCE: ${{ inputs.force }}
        run: |
 (not the start of the key)set -euo pipefail
 (not the start of the key)ref="${INPUT_SHA:-$UPSTREAM_BRANCH}"
 (not the start of the key)json=""
 (not the start of the key)for i in 1 2 3; do
 (not the start of the key)  json=$(gh api "repos/$UPSTREAM_REPO/commits/$ref" 2>/dev/null) && break
 (not the start of the key)  echo "attempt $i: could not resolve $ref; retrying in 15s"; sleep 15
 (not the start of the key)done
 (not the start of the key)[ -n "$json" ] || { echo "::error::cannot resolve $UPSTREAM_REPO@$ref"; exit 1; }
 (not the start of the key)sha=$(jq -r .sha <<<"$json")
 (not the start of the key)day=$(jq -r .commit.committer.date <<<"$json" | cut -c1-10 | tr -d -)
 (not the start of the key)published=$(cat .github/upstream-sha 2>/dev/null || true)
 (not the start of the key)echo "upstream $ref = $sha ($day); last published = ${published:-<none>}"
 (not the start of the key)echo "build_sha=$sha" >> "$GITHUB_OUTPUT"
 (not the start of the key)echo "label=${day}-${sha:0:7}" >> "$GITHUB_OUTPUT"
 (not the start of the key)if [ "$sha" = "$published" ] && [ "$FORCE" != "true" ]; then
 (not the start of the key)  echo "changed=false" >> "$GITHUB_OUTPUT"; echo "Already published; nothing to build."
 (not the start of the key)else
 (not the start of the key)  echo "changed=true" >> "$GITHUB_OUTPUT"
 (not the start of the key)fi

      - name: List build targets
        id: targets
        env:
 (not the start of the key)ONLY: ${{ inputs.target }}
        run: |
 (not the start of the key)set -euo pipefail
 (not the start of the key)list='[]'
 (not the start of the key)for f in .github/targets/*.env; do
 (not the start of the key)  name=$(basename "$f" .env)
 (not the start of the key)  [ -z "$ONLY" ] || [ "$ONLY" = "$name" ] || continue
 (not the start of the key)  image=$(bash -c "source '$f'; echo \"\$IMAGE\"")
 (not the start of the key)  list=$(jq -c --arg n "$name" --arg f "$f" --arg i "$image" '. + [{name:$n,file:$f,image:$i}]' <<<"$list")
 (not the start of the key)done
 (not the start of the key)[ "$list" != '[]' ] || { echo "::error::no target matches '${ONLY}'"; exit 1; }
 (not the start of the key)echo "targets=$list" >> "$GITHUB_OUTPUT"; echo "$list"

      - name: Keepalive commit if the repo has been quiet for 45 days
        if: steps.check.outputs.changed == 'false'
        run: |
 (not the start of the key)set -euo pipefail
 (not the start of the key)age=$(( ($(date +%s) - $(git log -1 --format=%ct)) / 86400 ))
 (not the start of the key)echo "last commit on main: ${age} days ago"
 (not the start of the key)[ "$age" -ge 45 ] || exit 0
 (not the start of the key)date -u +%FT%TZ > .github/keepalive
 (not the start of the key)git config user.name  "hermes-carpet"
 (not the start of the key)git config user.email "hermes-carpet@users.noreply.github.com"
 (not the start of the key)git add .github/keepalive
 (not the start of the key)git commit -m "keepalive: upstream quiet for ${age} days"
 (not the start of the key)git push

  # setup-toolchain.sh (distro + CUDA + gcc + CPU wrapper; ~2 min, changes only with the
  # profile) then the compile, with ccache kept across runs by actions/cache, keyed on the
  # toolchain hash: an upstream commit recompiles only what it touched.
  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.check.outputs.targets) }}
    name: build (${{ matrix.target.name }})
    env:
      BUILD_SHA: ${{ needs.check.outputs.build_sha }}
      LABEL: ${{ needs.check.outputs.label }}
    steps:
      - uses: actions/checkout@v6

      - name: ccache key (target + toolchain hash)
        id: tc
        run: |
 (not the start of the key)ref=$(bash .github/ci/toolchain-tag.sh "${{ matrix.target.file }}")
 (not the start of the key)echo "key=ccache-${ref}" >> "$GITHUB_OUTPUT"

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
 (not the start of the key)path: .ccache
 (not the start of the key)key: ${{ steps.tc.outputs.key }}-${{ env.BUILD_SHA }}-${{ github.run_id }}
 (not the start of the key)restore-keys: ${{ steps.tc.outputs.key }}-

      - name: Free runner disk (the CUDA toolkit + build need ~20 GB)
        run: |
 (not the start of the key)sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
 (not the start of the key)            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
 (not the start of the key)docker image prune -af >/dev/null || true
 (not the start of the key)df -h /

      - name: Fetch upstream at ${{ needs.check.outputs.build_sha }} (+ llama.cpp submodule)
        run: |
 (not the start of the key)set -euo pipefail
 (not the start of the key)mkdir upstream && cd upstream
 (not the start of the key)git init -q
 (not the start of the key)git remote add origin "https://github.com/$UPSTREAM_REPO"
 (not the start of the key)git fetch -q --depth 1 origin "$BUILD_SHA"
 (not the start of the key)git checkout -q FETCH_HEAD
 (not the start of the key)git submodule update --init --depth 1
 (not the start of the key)echo "upstream $(git rev-parse HEAD); llama.cpp $(git -C third_party/llama.cpp rev-parse HEAD)"

      - name: Toolchain + build + check + package in ${{ matrix.target.image }}
        run: |
 (not the start of the key)mkdir -p .ccache
 (not the start of the key)docker run --rm -v "$PWD:/w" -w /w -e JOBS=4 -e CCACHE_DIR=/w/.ccache "${{ matrix.target.image }}" \
 (not the start of the key)  bash .github/ci/build-in-container.sh "${{ matrix.target.file }}" /w/upstream /w/dist "$LABEL"
 (not the start of the key)sudo chown -R "$(id -u)" dist .ccache
 (not the start of the key)grep -v '^WARN' "dist/checks-${{ matrix.target.name }}.txt" | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY" || true

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
 (not the start of the key)path: .ccache
 (not the start of the key)key: ${{ steps.tc.outputs.key }}-${{ env.BUILD_SHA }}-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        with:
 (not the start of the key)name: pkg-${{ matrix.target.name }}
 (not the start of the key)path: |
 (not the start of the key)  dist/*.tar.gz
 (not the start of the key)  dist/SHA256SUMS-*.txt
 (not the start of the key)  dist/checks-*.txt
 (not the start of the key)retention-days: 7
 (not the start of the key)if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
 (not the start of the key)name: logs-${{ matrix.target.name }}
 (not the start of the key)path: |
 (not the start of the key)  dist/build-*.log
 (not the start of the key)  dist/test-*.log
 (not the start of the key)  dist/checks-*.txt
 (not the start of the key)retention-days: 14
 (not the start of the key)if-no-files-found: warn

  publish:
    needs: [check, build]
    runs-on: ubuntu-24.04
    env:
      BUILD_SHA: ${{ needs.check.outputs.build_sha }}
      LABEL: ${{ needs.check.outputs.label }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # latest main, not the run's start commit: main may have moved during a long build
      - uses: actions/checkout@v6
        with:
 (not the start of the key)ref: main
 (not the start of the key)fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
 (not the start of the key)pattern: 'pkg-*'
 (not the start of the key)path: artifacts
 (not the start of the key)merge-multiple: true

      - name: Create / update the release
        run: |
 (not the start of the key)set -euo pipefail
 (not the start of the key)tag="strata-${LABEL}"
 (not the start of the key)mapfile -t files < <(find artifacts -name '*.tar.gz' -o -name 'SHA256SUMS-*.txt' | sort)
 (not the start of the key)[ "${#files[@]}" -gt 0 ] || { echo "::error::no packages to publish"; exit 1; }
 (not the start of the key)if ! gh release view "$tag" >/dev/null 2>&1; then
 (not the start of the key)  gh release create "$tag" --title "UnbiasedStrata ${LABEL}" --notes "placeholder" --latest
 (not the start of the key)fi
 (not the start of the key)gh release upload "$tag" "${files[@]}" --clobber
 (not the start of the key)assets=$(gh release view "$tag" --json assets --jq '.assets[].name' | sort)
 (not the start of the key){
 (not the start of the key)  echo "AOT build of [\`$UPSTREAM_REPO\`@\`${BUILD_SHA:0:12}\`](https://github.com/$UPSTREAM_REPO/commit/$BUILD_SHA) — Linux x86_64, CUDA, per target machine."
 (not the start of the key)  echo
 (not the start of the key)  echo "## Targets"
 (not the start of the key)  for f in artifacts/checks-*.txt; do
 (not the start of the key)    t=$(basename "$f" .txt); t=${t#checks-}
 (not the start of the key)    echo "### \`$t\`"
 (not the start of the key)    echo '```'; grep -v '^WARN' "$f"; echo '```'
 (not the start of the key)  done
 (not the start of the key)  echo
 (not the start of the key)  echo "## Packages"
 (not the start of the key)  echo "- \`unbiased-strata-<label>-<target>.tar.gz\`: uses the target's own CUDA runtime (libcudart / libcublas from its toolkit)."
 (not the start of the key)  echo "- \`...-cudalibs.tar.gz\`: same binaries plus those CUDA runtime libs in \`bin/lib\` (only the NVIDIA driver needed)."
 (not the start of the key)  echo
 (not the start of the key)  echo "Binaries carry RUNPATH \`\$ORIGIN:\$ORIGIN/lib\`; \`BUILDINFO.txt\` in each tarball has the full target profile and CI checks."
 (not the start of the key)  echo
 (not the start of the key)  echo '```'
 (not the start of the key)  echo "tar xzf unbiased-strata-${LABEL}-<target>.tar.gz && cd unbiased-strata-${LABEL}-<target>"
 (not the start of the key)  echo 'bin/unbiased-strata --engine strata-poly -m <model.gguf> --host 127.0.0.1 --port 18091 -- --model <model.gguf>'
 (not the start of the key)  echo '```'
 (not the start of the key)  echo
 (not the start of the key)  echo "## Assets"
 (not the start of the key)  sed 's/^/- `/; s/$/`/' <<<"$assets"
 (not the start of the key)  echo
 (not the start of the key)  echo "_Not GPU-tested in CI (no GPU on GitHub runners): \`make test\` + structural CUDA checks only._"
 (not the start of the key)} > notes.md
 (not the start of the key)gh release edit "$tag" --notes-file notes.md

      - name: Sync fork main to the built upstream commit (commit as hermes-carpet)
        run: |
 (not the start of the key)set -euo pipefail
 (not the start of the key)git config user.name  "hermes-carpet"
 (not the start of the key)git config user.email "hermes-carpet@users.noreply.github.com"
 (not the start of the key)git fetch -q "https://github.com/$UPSTREAM_REPO" "$BUILD_SHA"
 (not the start of the key)if ! git merge --no-edit -m "sync upstream ${BUILD_SHA:0:12}" FETCH_HEAD; then
 (not the start of the key)  git merge --abort || true
 (not the start of the key)  echo "::error::merging upstream ${BUILD_SHA} into the fork conflicts (release was published; fork not synced)"
 (not the start of the key)  exit 1
 (not the start of the key)fi
 (not the start of the key)echo "$BUILD_SHA" > .github/upstream-sha
 (not the start of the key)git add .github/upstream-sha
 (not the start of the key)git commit -m "autobuild: published strata-${LABEL}" || echo "upstream-sha unchanged"
 (not the start of the key)git push origin HEAD:main

      - name: Close open auto-build issues
        run: |
 (not the start of the key)for n in $(gh issue list --state open --label "$ISSUE_LABEL" --json number --jq '.[].number'); do
 (not the start of the key)  gh issue close "$n" --comment "Fixed: [run ${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) published \`strata-${LABEL}\`."
 (not the start of the key)done

  report-failure:
    needs: [check, build, publish]
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_SHA: ${{ needs.check.outputs.build_sha }}
    steps:
      - name: Open or comment on the auto-build issue
        run: |
 (not the start of the key)set -euo pipefail
 (not the start of the key)gh label create "$ISSUE_LABEL" --repo "$GITHUB_REPOSITORY" --color d93f0b \
 (not the start of the key)  --description "Automated UnbiasedStrata build needs attention" 2>/dev/null || true
 (not the start of the key)run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
 (not the start of the key)failed=$(gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs \
 (not the start of the key)          --jq '.jobs[] | select(.conclusion=="failure") | "- \(.name)"')
 (not the start of the key)marker="<!-- auto-build:${BUILD_SHA:-unresolved}:${{ needs.check.result }}${{ needs.build.result }}${{ needs.publish.result }} -->"
 (not the start of the key)body=$(printf 'The autobuild failed for upstream `%s`.\n\nRun: %s\n\nFailed jobs:\n%s\n\nJob results: check=%s build=%s publish=%s\n\n%s\n' \
 (not the start of the key)        "${BUILD_SHA:-<unresolved>}" "$run_url" "$failed" \
 (not the start of the key)        "${{ needs.check.result }}" "${{ needs.build.result }}" "${{ needs.publish.result }}" "$marker")
 (not the start of the key)open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label "$ISSUE_LABEL" --json number --jq '.[0].number // empty')
 (not the start of the key)if [ -n "$open" ]; then
 (not the start of the key)  if gh issue view "$open" --repo "$GITHUB_REPOSITORY" --comments --json body,comments \
 (not the start of the key)       --jq '[.body] + [.comments[].body] | join("\n")' | grep -qF "$marker"; then
 (not the start of the key)    echo "Already reported on #$open"; exit 0
 (not the start of the key)  fi
 (not the start of the key)  gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "$body"
 (not the start of the key)else
 (not the start of the key)  gh issue create --repo "$GITHUB_REPOSITORY" --label "$ISSUE_LABEL" \
 (not the start of the key)    --title "Autobuild failing (upstream ${BUILD_SHA:0:12})" --body "$body"
 (not the start of the key)fi
